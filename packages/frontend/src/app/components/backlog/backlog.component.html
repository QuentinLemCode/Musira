<p *ngIf="loading">Chargement ...</p>
<p *ngIf="error">{{ error }}</p>

<ng-container *ngIf="backlog !== null">
  <musira-music
    *ngFor="let item of backlog"
    [music]="item.music"
    [config]="musicConfig"
    (delete)="delete(item.id)"
    [message]="'Joué ' + item.play_count + ' fois'"
  ></musira-music>
</ng-container>
