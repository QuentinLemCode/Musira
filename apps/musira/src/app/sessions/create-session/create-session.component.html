<form [formGroup]="createSessionForm">
  <label
    >Nom de la session :<input
      type="text"
      name="session-name"
      #sessionName
      formControlName="name"
  /></label>
</form>

<p>
  Vous avez besoin d'un compte Spotify Premium pour créer une session. Nous ne
  stockons aucune de vos données Spotify, nous l'utilisons uniquement pour
  lancer les musiques sur votre appareil.

<musira-spotify-login
  [beforeLoginHandler]="createSession(sessionName.value)"
  [disabled]="name?.invalid || false"
></musira-spotify-login>
