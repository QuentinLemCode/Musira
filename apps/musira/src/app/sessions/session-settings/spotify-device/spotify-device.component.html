<p *ngIf="error" class="error">{{ error }}</p>

<div class="border border-b-dark dark:border-b-white border-r-4 rounded-lg" *ngIf="musicStatus; else loading">
  <ng-container
    *ngIf="
      musicStatus.isSpotifyAccountRegistered === true;
      else notAuthenticated
    "
  >
    <p>Cette session est connecté à un compte Spotify</p>
    <button (click)="logoutPlayer()">Déconnecter de Spotify</button>
    <h3>
      État du moteur de playlist :
      {{ musicStatus.engineStarted ? 'Démarré' : 'Arreté' }}
    </h3>
    <button *ngIf="!musicStatus.engineStarted" (click)="startEngine()">
      Démarrer
    </button>
    <button *ngIf="musicStatus.engineStarted" (click)="stopEngine()">
      Arrêter
    </button>
    <p *ngIf="musicStatus.message">{{ musicStatus.message }}</p>
    <h3>Musique en cours de lecture sur Spotify :</h3>
    <musira-music
      *ngIf="musicStatus.currentPlay"
      [music]="musicStatus.currentPlay"
    ></musira-music>
    <h3>File d'attente :</h3>
    <musira-queue></musira-queue>
    <h3>Backlog :</h3>
    <musira-search></musira-search>
    <musira-backlog></musira-backlog>
  </ng-container>
</div>

<ng-template #notAuthenticated>
  <musira-spotify-login [redirect_to]="'session-settings'"></musira-spotify-login>
</ng-template>

<ng-template #loading>
  <p>Chargement...</p>
</ng-template>
