<main>
<h1>Créer une session musicale</h1>
<div class="flex">
  <button routerLink="create-session">Créer une session</button>
</div>
<hr />

  <h1>Rejoindre une session</h1>
  <form [formGroup]="form" (ngSubmit)="joinSession()">
    <div class="join-session">
      <label for="code"
        >Code de session</label>
        <input
        type="text"
        name="code"
        formControlName="code"
        placeholder="123456789"
    />

    </div>
    <button (click)="joinSession()" [disabled]="form.invalid">Rejoindre une session</button>

  </form>
  <div
  class="error"
  *ngIf="form.controls.code.invalid && form.controls.code.touched"
>
  Le code de session doit comporter 9 chiffres.
</div>
</main>

<h2>Historique des sessions</h2>
<ul>
  <li *ngFor="let session of this.sessionHistory">
    <a [routerLink]="'' + session.musicSession.code">{{
      session.musicSession.code
    }}</a>
  </li>
</ul>
