<form [formGroup]="createSessionForm">
  <label
    >Nom de la session :<input
      type="text"
      name="session-name"
      #sessionName
      formControlName="name"
  /></label>
</form>
<musira-spotify-login
  [beforeLoginHandler]="createSession(sessionName.value)"
  [disabled]="name?.invalid || false"
></musira-spotify-login>
