name: Test and build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TZ: Europe/Paris

permissions:
  contents: read
  packages: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - run: npm i
      - run: npm run format:check
      - run: npm run ci:lint
      - run: npm run build:backend
      - name: Launch database
        run: docker compose -f docker-compose.test.yml up -d
      - run: npm run openapi
      - run: npm run api:generate
      - run: npm run build:frontend
      # Run backend unit tests (Jest)
      - name: Run unit tests (backend)
        run: npm --workspace @musira/backend run test
      - name: Run unit tests (frontend)
        run: npm --workspace @musira/frontend run test

      # Install Playwright browsers and system dependencies
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Generate local SSL certs for Angular HTTPS dev server
      - name: Generate SSL certificates
        run: npm run generate-ssl

      # Start backend and frontend and wait for readiness
      - name: Start application (backend + frontend)
        run: |
          export COOKIE_SECURE=false
          npm run start:backend &
          npm run start:frontend &
          echo "Waiting for backend..."
          for i in {1..120}; do
            if curl -sSf http://localhost:3020/health > /dev/null; then
              echo "Backend is up"; break; fi; sleep 1; done
          echo "Waiting for frontend (HTTP)..."
          for i in {1..120}; do
            if curl -sSf https://localhost:4200 > /dev/null; then
              echo "Frontend is up"; break; fi; sleep 1; done

      # Run Playwright E2E tests against https://localhost:4200
      - name: Run E2E tests
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  build:
    if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'build') }}
    needs: test
    runs-on: ubuntu-latest
    outputs:
      IMAGE_URL: ${{ steps.image.outputs.image_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: packages/backend
          file: packages/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm/v8,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Set image URL output
        id: image
        run: echo "image_url=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}" >> $GITHUB_OUTPUT
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Image to CapRrover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: '${{ secrets.CAPROVER_SERVER }}'
          app: '${{ secrets.APP_NAME }}'
          token: '${{ secrets.APP_TOKEN }}'
          image: ${{ needs.build.outputs.IMAGE_URL }}
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    needs: test
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: 'Automerge'
        uses: pascalgn/automerge-action@v0.16.3
        env:
          MERGE_LABELS: dependencies
          MERGE_METHOD: squash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_DELETE_BRANCH: true
