name: 'Dependabot Automerge - Action'

on:
  pull_request:
    types: [labeled]

jobs:
  name: View PR author
    run: echo "This PR is opened by ${{ github.event.pull_request.user.login }} ."
  automerge:
    name: 'Automerge PR'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
      statuses: read
    if: ${{ (github.event.pull_request.user.login == 'dependabot[bot]') && (github.event.label.name == 'automerge') }}
    steps:
      - name: 'Wait for status checks'
        id: waitforstatuschecks
        uses: WyriHaximus/github-action-wait-for-status@v1.7.1
        with:
          ignoreActions: 'Automerge PR'
          checkInterval: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Automerge'
        uses: pascalgn/automerge-action@v0.15.6
        if: steps.waitforstatuschecks.outputs.status == 'success'
        env:
          MERGE_LABELS: dependencies
          MERGE_METHOD: squash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_DELETE_BRANCH: true
