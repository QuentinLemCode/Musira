name: Deploy

on:
  workflow_run:
    workflows: ['Test and build']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion != 'failure' }}
    name: 'Deploy on Raspberry ⚡'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for current deployment
        uses: softprops/turnstyle@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          abort-after-seconds: 300
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/deploy.key
          chmod 600 ~/.ssh/deploy.key
          cat >>~/.ssh/config <<END
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Connect to GHCR
        run: ssh server 'docker login ghcr.io -u ${{ secrets.GHCR_USER }} -p ${{ secrets.GHCR_TOKEN }}'

      - name: Pull updated images
        run: ssh server 'docker compose pull'

      - name: Launch updated container
        if: ${{ always() }}
        run: ssh server 'docker compose up -d --no-deps'

      - name: Clean old images
        run: ssh server 'sleep 2m; docker image prune -f'
