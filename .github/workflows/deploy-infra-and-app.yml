name: (disabled) Deploy infra and apps (GCP + CapRover + Cloudflare)

on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install root deps
        run: npm i --ignore-scripts

      - name: Install infra deps
        working-directory: packages/infra
        run: npm i --ignore-scripts

      - name: Set up gcloud auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Pulumi
        uses: pulumi/setup-pulumi@v2

      - name: Configure Pulumi CLI
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: echo "Pulumi configured"

      - name: Select or init Pulumi stack
        working-directory: packages/infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi stack select dev || pulumi stack init dev

      - name: Set Pulumi configs
        working-directory: packages/infra
        run: |
          pulumi config set gcp:project ${{ secrets.GCP_PROJECT_ID }} --stack dev --non-interactive
          pulumi config set gcp:region ${{ secrets.GCP_REGION }} --stack dev --non-interactive
          pulumi config set gcp:zone ${{ secrets.GCP_ZONE }} --stack dev --non-interactive
          pulumi config set infra:cloudflareZone ${{ secrets.CF_ZONE_ID }} --stack dev --non-interactive

      - name: Pulumi up (provision infra)
        working-directory: packages/infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ''
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pulumi up --yes --skip-preview --stack dev

      - name: Read Pulumi outputs
        id: read_outputs
        working-directory: packages/infra
        run: |
          OUT=$(pulumi stack output --json --stack dev)
          echo "out=$OUT" >> $GITHUB_OUTPUT

      - name: Parse outputs
        id: parse
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          echo '${{ steps.read_outputs.outputs.out }}' | jq -r '.' > outputs.json
          echo "INSTANCE_IP=$(cat outputs.json | jq -r '.instanceIp')" >> $GITHUB_ENV
          echo "CAPROVER_DASHBOARD=$(cat outputs.json | jq -r '.caproverDashboard')" >> $GITHUB_ENV
          echo "DB_CONNECTION_NAME=$(cat outputs.json | jq -r '.cloudSqlConnectionName')" >> $GITHUB_ENV
          echo "DB_NAME=$(cat outputs.json | jq -r '.cloudSqlDb')" >> $GITHUB_ENV
          echo "DB_USER=$(cat outputs.json | jq -r '.cloudSqlUser')" >> $GITHUB_ENV
          echo "DB_PASSWORD=$(cat outputs.json | jq -r '.cloudSqlPassword')" >> $GITHUB_ENV
          echo "DB_PUBLIC_IP=$(cat outputs.json | jq -r '.cloudSqlPublicIp')" >> $GITHUB_ENV

      - name: Install CapRover CLI
        run: npm i -g caprover

      - name: Deploy backend to CapRover (password auth)
        env:
          CAPROVER_SERVER: https://captain.${{ secrets.APEX_DOMAIN }}
          CAPROVER_ADMIN_PASSWORD: ${{ secrets.CAPROVER_ADMIN_PASSWORD }}
          BACKEND_APP: ${{ secrets.BACKEND_APP }}
          BACKEND_IMAGE: ${{ secrets.BACKEND_IMAGE }}
        run: |
          caprover deploy \
            --caproverUrl=${CAPROVER_SERVER} \
            --caproverPassword=${CAPROVER_ADMIN_PASSWORD} \
            --appName=${BACKEND_APP} \
            --imageName=${BACKEND_IMAGE}

      - name: Deploy frontend to Cloudflare (wrangler)
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NODE_ENV: production
          API_ORIGIN: ${{ secrets.BACKEND_ORIGIN }}
        run: |
          npm i --ignore-scripts
          npm run build
          npx wrangler deploy --var API_ORIGIN=${{ secrets.BACKEND_ORIGIN }}

      - name: Bind musira.fr and www to Worker (custom domains)
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Add apex domain (idempotent)
          npx wrangler domains add ${{ secrets.APEX_DOMAIN }} || true
          # Add www subdomain (idempotent)
          npx wrangler domains add www.${{ secrets.APEX_DOMAIN }} || true
