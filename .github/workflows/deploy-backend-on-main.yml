name: Deploy backend to CapRover on main

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Install CapRover CLI
        run: npm i -g caprover

      - name: Deploy to CapRover (password auth)
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_ADMIN_PASSWORD: ${{ secrets.CAPROVER_ADMIN_PASSWORD }}
          BACKEND_APP: ${{ secrets.BACKEND_APP }}
        run: |
          caprover deploy \
            --caproverUrl=${CAPROVER_SERVER} \
            --caproverPassword=${CAPROVER_ADMIN_PASSWORD} \
            --appName=${BACKEND_APP} \
            --imageName=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
